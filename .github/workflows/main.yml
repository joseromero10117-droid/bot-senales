name: Bot de Señales Automático

on:
  schedule:
    # Se ejecuta cada 15 minutos
    - cron: '*/15 * * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    # Permisos necesarios para que el bot pueda escribir y guardar en el repositorio
    permissions:
      contents: write

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          # Si usas librerías adicionales en tu bot.py, agrégalas aquí (ej: requests)

      - name: Ejecutar bot de señales
        run: python bot.py

      - name: Guardar y actualizar cambios en GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add índice.html
          git commit -m "Auto: Nueva señal registrada en índice.html" || exit 0
          git push
