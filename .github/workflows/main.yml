name: Bot de Señales Automático

on:
  schedule:
    # Se ejecuta cada 15 minutos
    - cron: '*/15 * * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    # Permisos explícitos de lectura y escritura requeridos
    permissions:
      contents: write

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip

      - name: Ejecutar bot de señales
        run: python bot.py

      - name: Guardar y actualizar cambios en GitHub automáticamente
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: índice.html
          commit_message: "Auto: Nueva señal registrada en índice.html"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
